name: Build iOS (Manual)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: Build mode
        required: true
        default: release
        type: choice
        options:
          - release
          - profile
          - debug
      no_codesign:
        description: Build without Apple code signing
        required: true
        default: true
        type: boolean

jobs:
  ios-build:
    name: iOS IPA Build
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Show tool versions
        run: |
          flutter --version
          dart --version
          xcodebuild -version

      - name: Install dependencies
        run: flutter pub get

      - name: Build IPA (no code signing)
        if: ${{ inputs.no_codesign }}
        run: flutter build ipa --${{ inputs.build_mode }} --no-codesign

      - name: Build IPA (with code signing)
        if: ${{ !inputs.no_codesign }}
        run: flutter build ipa --${{ inputs.build_mode }}

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-ipa-${{ inputs.build_mode }}
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload Xcode archive artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-xcarchive-${{ inputs.build_mode }}
          path: build/ios/archive/*.xcarchive
          if-no-files-found: warn
          retention-days: 7